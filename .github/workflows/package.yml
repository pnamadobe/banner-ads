# Packages exported HTML5 ads for CM360 (zip + GIF preview + storyboard + fidelity report).
# Triggered by the AEM extension with repository_dispatch (type "package"). The payload holds a
# short-lived writeback token, so it is written to a file and never echoed.
name: Package HTML5 ads

on:
  repository_dispatch:
    types: [package]

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.client_payload.job }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      - name: Install Playwright (CI only)
        run: |
          npm install --no-save playwright@1
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Write payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
      - name: Package
        run: node tools/package/run.mjs "$RUNNER_TEMP/payload.json"
